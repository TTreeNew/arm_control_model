# Default initial positions for panda_arm's ros2_control system
# 在 panda_arm.urdf.xacro的 L3 和 panda_arm.ros2_control.xacro的 L7，L25 加载，但hardware并未使用
# hardware 的 on_activate 里使用电机读取的当前位置作为初始位置
# 仿真的时候 Gazebo 默认0位置作为初始位置，也不从此文件获取
# 如果没有其他配置，模型默认把urdf里origin描述的位置作为0位置

initial_positions:
  joint_1: 0
  joint_2: 0
  joint_3: 0
  joint_4: 0
  joint_5: 0
  joint_6: 0
  joint_7: 0